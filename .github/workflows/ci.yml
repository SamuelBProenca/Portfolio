name: Portfolio checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret protection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install verified secret scanner
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Reject private files and scan history with redacted output
        run: node portfolio/scripts/check-repository-security.mjs --history
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Locate application
        id: app
        shell: bash
        run: |
          if [ -f portfolio/package.json ]; then
            echo "directory=portfolio" >> "$GITHUB_OUTPUT"
          else
            echo "directory=." >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.app.outputs.directory }}/package-lock.json
      - run: npm ci
        working-directory: ${{ steps.app.outputs.directory }}
      - run: npm run check
        working-directory: ${{ steps.app.outputs.directory }}
      - run: npm run build
        working-directory: ${{ steps.app.outputs.directory }}
      - name: Install Chromium and system dependencies
        shell: bash
        run: |
          # Avoid stalled font downloads from the runner image's Azure mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium
        working-directory: ${{ steps.app.outputs.directory }}
      - name: Browser tests against production server
        working-directory: ${{ steps.app.outputs.directory }}
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        shell: bash
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/portfolio-next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/ > /dev/null
          npm run test:e2e
